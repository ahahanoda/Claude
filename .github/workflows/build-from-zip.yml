name: Build APK from zip

# リポジトリのルートに PictoWifi.zip を置いてpushすると、
# 展開してビルドし、APKをArtifactsに出力します。
# このファイルは .github/workflows/build-from-zip.yml として保存してください。

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          test -f PictoWifi.zip || { echo "PictoWifi.zip がリポジトリのルートにありません"; exit 1; }
          unzip -q -o PictoWifi.zip

      # sdkmanager は JDK 17 以上が必要なので、SDKの準備は JDK 17 で行う
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-29" "build-tools;29.0.2"

      # AGP 4.1.x は JDK 11 でないと動かないので、ビルド前に切り替える
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      # AGP 4.1.3 は Gradle 6.5 以上が必要
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '6.7.1'

      - name: Build debug APK
        working-directory: PictoWifi
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: PictoWifi-debug-apk
          path: PictoWifi/app/build/outputs/apk/debug/*.apk
